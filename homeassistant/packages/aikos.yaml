# aikos: Home Assistant package (stand-in until the aikos integration exists).
# Source of truth: github.com/aikos-home/aikos, homeassistant/packages/aikos.yaml. Deploy from there, don't edit in place.
# House-specific values (people, how the AI host is reached) live in packages/aikos_local.yaml (see aikos_local.example.yaml).
# Owner: aikos core. What it does: homeassistant/README.md.

script:
  aikos_restart_all:
    alias: "aikos: alles neu starten"
    description: >-
      Startet alle aikos-Komponenten neu: zuerst die KI-Dienste (Spracherkennung, Sprachmodell, Transkription; shell_command.aikos_restart_services
      aus aikos_local.yaml), dann alle
      aikos-Geräte außer der Klingel, zuletzt die Klingel. Geräte werden an ihrem Projekt erkannt (Hersteller
      aikos-home), gedrückt werden nur echte Neustart-Knöpfe, nie ein Werksreset.
    icon: mdi:restart
    mode: single
    fields:
      probelauf:
        name: Probelauf
        description: Nur anzeigen, was neu gestartet würde. Nichts wird neu gestartet.
        default: false
        selector:
          boolean:
    variables:
      probe: "{{ probelauf | default(false) | bool }}"
      knoepfe: >-
        {{ integration_entities('esphome') | select('match','button[.]')
           | select('is_device_attr','manufacturer','aikos-home')
           | select('is_state_attr','device_class','restart')
           | reject('search','factory_reset') | list }}
      klingel: "{{ knoepfe | select('is_device_attr','model','intercom-bell') | list }}"
      andere: "{{ knoepfe | reject('in', klingel) | list }}"
      ohne_knopf: >-
        {{ integration_entities('esphome') | map('device_id') | reject('none') | unique
           | select('is_device_attr','manufacturer','aikos-home')
           | reject('in', knoepfe | map('device_id') | unique | list)
           | map('device_attr','name') | list }}
    sequence:
      - action: shell_command.aikos_restart_services
        data:
          ziel: "{{ 'dryrun' if probe else 'all' }}"
        response_variable: mac
        continue_on_error: true
      - variables:
          mac_text: "{{ (mac.stdout if mac is defined and mac.stdout is defined else 'keine Antwort vom KI-Server') | trim }}"
      - if: "{{ probe }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: aikos_restart_all
              title: "aikos: Probelauf (nichts neu gestartet)"
              message: |
                **KI-Dienste:** {{ mac_text }}
                **Geräte zuerst:** {{ andere | join(', ') if andere else 'keine' }}
                **Klingel zuletzt:** {{ klingel | join(', ') if klingel else 'keine' }}
                **Ohne Neustart-Knopf (werden nicht neu gestartet):** {{ ohne_knopf | join(', ') if ohne_knopf else 'keine' }}
          - stop: Probelauf
      - if: "{{ andere | count > 0 }}"
        then:
          - action: button.press
            target:
              entity_id: "{{ andere }}"
          - delay: 5
          - wait_template: "{{ andere | select('is_state', 'unavailable') | list | count == 0 }}"
            timeout: 90
      - variables:
          andere_fehlen: "{{ andere | select('is_state', 'unavailable') | list }}"
      - if: "{{ klingel | count > 0 }}"
        then:
          - action: button.press
            target:
              entity_id: "{{ klingel }}"
          - delay: 5
          - wait_template: "{{ klingel | select('is_state', 'unavailable') | list | count == 0 }}"
            timeout: 60
      - variables:
          klingel_fehlt: "{{ klingel | select('is_state', 'unavailable') | list }}"
      - action: persistent_notification.create
        data:
          notification_id: aikos_restart_all
          title: >-
            {{ 'aikos: alles neu gestartet' if not andere_fehlen and not klingel_fehlt and 'NOT' not in mac_text
               else 'aikos: Neustart mit Problemen' }}
          message: |
            **KI-Dienste:** {{ mac_text }}
            **Geräte:** {{ andere | count }} neu gestartet{{ ', noch nicht zurück: ' ~ andere_fehlen | join(', ') if andere_fehlen else ', alle zurück' }}
            **Klingel:** {{ 'neu gestartet, ' ~ ('noch nicht zurück!' if klingel_fehlt else 'zurück') if klingel else 'keine gefunden' }}
            **Ohne Neustart-Knopf:** {{ ohne_knopf | join(', ') if ohne_knopf else 'keine' }}

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# voice v2, part A: what aikos tells the devices (front door) and the bench test helpers. Stand-ins until the integration has them.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────

input_text:
  aikos_front_door_source:
    name: "aikos: Quelle Haustürsensor"
    icon: mdi:door
    max: 255

input_boolean:
  aikos_test_in_call:
    name: "TEST aikos Gespräch läuft (Test-Protokoll)"
    icon: mdi:phone-in-talk
  aikos_test_front_door:
    name: "TEST aikos Haustür (Prüfstand)"
    icon: mdi:door

input_button:
  aikos_test_new_call:
    name: "TEST aikos neues Gespräch (Test-Protokoll)"
    icon: mdi:phone-plus
  aikos_test_doorbell:
    name: "TEST aikos Klingel (Prüfstand)"
    icon: mdi:doorbell

template:
  # Test doorbell for the aikos ring push: pressing the button = one press (on for 1 s). Point aikos' "Doorbell" option here for a
  # bench test instead of the real bell, so tests never touch the real doorbell entities.
  - triggers:
      - trigger: state
        entity_id: input_button.aikos_test_doorbell
    binary_sensor:
      - name: "aikos TEST doorbell"
        unique_id: aikos_test_doorbell
        state: "true"
        auto_off: "00:00:01"
  - binary_sensor:
      # Front door, 2 s debounced. Devices only react to an off→on edge. Open > 10 min → stuck (ends nothing).
      - name: "aikos front door"
        unique_id: aikos_front_door
        device_class: door
        delay_on: "00:00:02"
        delay_off: "00:00:02"
        availability: "{{ states(states('input_text.aikos_front_door_source')) in ['on', 'off'] }}"
        state: "{{ is_state(states('input_text.aikos_front_door_source'), 'on') }}"
        attributes:
          source: "{{ states('input_text.aikos_front_door_source') }}"
          stuck: >-
            {% set src = states('input_text.aikos_front_door_source') %}
            {% set s = (expand(src) | first) if src else none %}
            {{ s is not none and s.state == 'on' and (now() - s.last_changed).total_seconds() > 600 }}
      # Quiet hours moved into the aikos integration (custom_components/aikos, binary_sensor.aikos_quiet_hours).
  # The call log (sensor.aikos_call_log, sensor.aikos_call_log_test) moved into the aikos integration (0.3.0).

automation:
  # aikos_call_message event + logbook entry: now done by the aikos integration's call log (0.3.0).

  # R23 (01.10.): a full dev archive of all calls, one JSON line per event, in /config/aikos_archive/calls.jsonl.
  # Written by the core File integration (notify.aikos_call_archive; set up once, see homeassistant/README.md), never by a
  # shell, so visitor text can never become a command. Devices are found by manufacturer "aikos-home", not by name.
  # Without the notify entity (a house that doesn't want an archive) the action fails quietly.
  - id: aikos_call_archive
    alias: "aikos: Gesprächsarchiv (R23)"
    description: "Beginn (mit Firmware-Versionen), jede Transkription und Ende jedes Gesprächs als JSON-Zeile ins Archiv; Test-Verkehr markiert."
    mode: queued
    max: 100
    triggers:
      - trigger: state
        entity_id: binary_sensor.aikos_intercom_talk_in_call
        from: "off"
        to: "on"
        id: start
      - trigger: state
        entity_id: binary_sensor.aikos_intercom_talk_in_call
        from: "on"
        to: "off"
        id: end
      - trigger: state
        entity_id: input_boolean.aikos_test_in_call
        from: "off"
        to: "on"
        id: start_test
      - trigger: state
        entity_id: input_boolean.aikos_test_in_call
        from: "on"
        to: "off"
        id: end_test
      - trigger: event
        event_type: aikos_talk_transcript
        id: msg
      - trigger: event
        event_type: aikos_talk_transcript_test
        id: msg_test
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.aikos_call_archive
        data:
          message: >-
            {%- set test = trigger.id.endswith('_test') -%}
            {%- set call_ent = 'input_boolean.aikos_test_in_call' if test else 'binary_sensor.aikos_intercom_talk_in_call' -%}
            {%- if trigger.id in ['start', 'start_test'] -%}
              {%- set ns = namespace(d=[]) -%}
              {%- for did in integration_entities('esphome') | map('device_id') | reject('none') | unique -%}
                {%- if device_attr(did, 'manufacturer') == 'aikos-home' -%}
                  {%- set ns.d = ns.d + [{'name': device_attr(did, 'name'), 'model': device_attr(did, 'model'),
                                          'sw': device_attr(did, 'sw_version')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {'type': 'call_start', 't': now().isoformat(timespec='seconds'), 'test': test,
                  'call_id': trigger.to_state.last_changed.isoformat(timespec='seconds'), 'devices': ns.d} | to_json }}
            {%- elif trigger.id in ['end', 'end_test'] -%}
              {{ {'type': 'call_end', 't': now().isoformat(timespec='seconds'), 'test': test,
                  'call_id': trigger.from_state.last_changed.isoformat(timespec='seconds'),
                  'duration_s': ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() | round(1))} | to_json }}
            {%- else -%}
              {%- set d = trigger.event.data -%}
              {%- set running = is_state(call_ent, 'on') -%}
              {{ {'type': 'message', 't': d.get('created', now().isoformat(timespec='seconds')), 'test': test,
                  'call_id': (states[call_ent].last_changed.isoformat(timespec='seconds') if running else ''),
                  'in_call': running, 'side': d.get('side', ''), 'speaker': d.get('speaker', ''),
                  'role': d.get('speaker_role', ''), 'urgent': d.get('urgent', false), 'message': d.get('message', ''),
                  'text': d.get('text', ''), 'text_original': d.get('text_original', ''), 'language': d.get('language', ''),
                  'device': d.get('device', ''), 'duration_s': d.get('duration_s'), 'transcribe_s': d.get('transcribe_s'),
                  'model': d.get('model', ''), 'transcriber': d.get('version', '')} | to_json }}
            {%- endif -%}
