# The door message register (for the aikos app). Who may do what is decided by the app (aikos-app A15, A38).
door_messages:
door_message_delete:
  fields:
    id:
      required: true
      example: nachricht-20261021-084700
      selector:
        text:
    by:
      selector:
        text:
door_message_heard:
  fields:
    id:
      required: true
      example: nachricht-20261021-084700
      selector:
        text:
    by:
      required: true
      selector:
        text:
# Door actions (for the aikos app; aikos-app A11–A14, A39–A41).
bell_mute:
  fields:
    minutes:
      example: 60
      selector:
        number: {min: 1, max: 10080, unit_of_measurement: min}
    until_time:
      example: "07:00"
      selector:
        time:
    forever:
      selector:
        boolean:
bell_unmute:
quiet_hours:
  fields:
    enabled:
      selector:
        boolean:
    start:
      selector:
        time:
    end:
      selector:
        time:
door_say:
  fields:
    message:
      required: true
      example: Komme sofort
      selector:
        text:
    sender:
      selector:
        text:
    voice:
      selector:
        text:
door_say_cancel:
door_picture:
  fields:
    image:
      required: true
      selector:
        text:
door_picture_clear:
door_greeting:
  fields:
    enabled:
      selector:
        boolean:
    text:
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    clear_window:
      selector:
        boolean:
    audio:
      selector:
        text:
    clear_audio:
      selector:
        boolean:
    voice:
      selector:
        text:
door_announcements:
  fields:
    disclosure:
      selector:
        number:
          min: 0
          max: 4
          mode: slider
    parcel:
      selector:
        text:
    away:
      selector:
        text:
    quiet:
      selector:
        text:
    away_places:
      selector:
        text:
    places:
      selector:
        object:
    named:
      selector:
        entity:
          domain: person
          multiple: true
    voice:
      selector:
        text:
door_say_audio:
  fields:
    audio:
      required: true
      selector:
        text:
    sender:
      selector:
        text:
    seconds:
      selector:
        number:
          min: 0
          max: 120
app_talker:
  fields:
    ip:
      selector:
        text:
    name:
      selector:
        text:
