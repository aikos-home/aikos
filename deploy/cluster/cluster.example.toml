# Inventory of one house. Copy it into a PRIVATE place (it names your addresses), never into this repository.
# Secrets are not in here: they are generated on the nodes, or read from the files named below on the admin machine.

[cluster]
domain = "app.example.org"        # the passkey domain (RP ID); changing it later invalidates every passkey
vip = "192.0.2.29"                # the virtual address that follows a healthy node
prefix = 24
vrid = 229                        # VRRP router id, unique on this network
trusted_proxies = "192.0.2.3"     # the reverse proxy in front of the house (may name the client)

[ha]
url = "http://192.0.2.10:8123"
token_file = "~/.aikos/ha-token"  # read here, copied to the nodes (0400, only the app can read it)

[ssh]
user = "aikos"
key = "~/.ssh/aikos_vms_ed25519"

# Only if the image is private: a read-only registry token in a file here (GHCR: classic token, scope read:packages).
# [registry]
# user = "your-github-user"
# token_file = "~/.aikos/ghcr-read-token"

# [tts]                           # optional: the house's voice service for "Meine Stimme" (services/tts)
# url = "http://192.0.2.110:10201"
# token_file = "~/.aikos/tts-token"  # copied to the nodes (0400, only the app can read it)

[app]                             # optional AIKOS_APP_* settings (lower case, without the prefix)
door_media_dir = "aikos_door"
# door_talk_host = "192.0.2.72"     # the door's talk computer: talking from the app (each node gets its own address, UDP
#                                   # 5012; the nodes' firewall must let that address in on UDP 5012)

[[nodes]]
name = "aikos-1"
ip = "192.0.2.31"
priority = 110

[[nodes]]
name = "aikos-2"
ip = "192.0.2.32"
priority = 100

[[nodes]]
name = "aikos-3"
ip = "192.0.2.33"
priority = 90
