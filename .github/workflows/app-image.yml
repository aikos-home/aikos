name: app image
# Pull requests: build the image and smoke-test it. main: also push it to GHCR and sign it (keyless, cosign).
# The aikos VMs only run images whose signature names this workflow on main.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-image.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-image.yml"
permissions:
  contents: read
jobs:
  app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/aikos-home/aikos-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app
          load: true
          tags: aikos-app:test
          build-args: AIKOS_APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health with commit, PWA served, runs as non-root)
        run: |
          docker run -d --name app --network host aikos-app:test
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8780/api/v1/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8780/api/v1/health | tee /dev/stderr | grep -q '"commit": "${{ github.sha }}"'
          curl -fsS http://127.0.0.1:8780/ | grep -q '<title>aikos</title>'
          test "$(docker exec app id -u)" = "10001"
          docker rm -f app
      - if: github.event_name == 'push'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: AIKOS_APP_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - if: github.event_name == 'push'
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.6.5  # the same version the nodes verify with (deploy/cluster/apply.py)
      - if: github.event_name == 'push'
        name: Sign (keyless, bound to this workflow on main)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
