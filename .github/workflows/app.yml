name: app checks
on:
  push:
    paths:
      - "app/**"
      - "deploy/cluster/**"
      - ".github/workflows/app.yml"
  pull_request:
permissions:
  contents: read
jobs:
  app-unit:
    runs-on: ubuntu-latest
    services:
      # The database of the three-VM setup; the same tests run once on SQLite and once on this.
      rqlite:
        image: rqlite/rqlite:10.5.2@sha256:73cc238054ece2df08a65747a549062bfd454d6bdcdbbafe2a98fb3897723fff
        ports:
          - 4001:4001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # A fake Home Assistant and a software passkey; nothing talks to a real house.
      - run: python -m pip install --require-hashes --no-deps -r app/requirements.lock
      - run: python -m pip install "pytest>=8" "pytest-aiohttp>=1.0"
      - run: python -m pytest app/tests -q
      - name: Same tests on rqlite
        run: |
          for i in $(seq 30); do curl -fsS http://127.0.0.1:4001/readyz && break; sleep 1; done
          AIKOS_TEST_DB=rqlite://127.0.0.1:4001 python -m pytest app/tests -q
      - name: Cluster kit (rendered files, rollout decision, lock statement)
        run: python -m pytest deploy/cluster/tests -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: app/web
      - run: npm run build
        working-directory: app/web
